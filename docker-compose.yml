# DocLifts — VPS compose stack (tailnet-only, no Caddy)
# db + web co-locate; app serves directly on the VPS tailnet IP port 3000.
# Secrets live in .env (NOT committed). DATABASE_URL points at the db service,
# not localhost, so the web container resolves the db over the compose network.
#
# Tailnet-only design (owner direction): the web service is published on the
# VPS tailnet IP (100.118.77.26:3000), reachable only from the tailnet — no
# public exposure, no Caddy, no public TLS termination.
#
# T6: Tailscale Serve terminates TLS at https://enochnvps.tail29bbdb.ts.net and
# proxies to the tailnet IP above. The app still speaks plain HTTP to the proxy;
# only the edge is encrypted. That is why the port publish is 100.118.77.26 and
# not 127.0.0.1 — the app does not listen on loopback, so Serve must reach it at
# the address it is actually published on. (A first attempt proxying to
# 127.0.0.1:3000 returned 502 from Serve for exactly this reason.)
services:
  db:
    image: postgres:16
    container_name: doclifts-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: doclifts
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in the production env file; use scripts/compose-prod.sh}
      POSTGRES_DB: doclifts
    # Bind to the compose service only (no host port). Web reaches it by
    # service name; nothing exposes 5432 off the docker network on the VPS.
    expose:
      - '5432'
    volumes:
      - doclifts_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U doclifts -d doclifts']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Baked into /_app/version.json so a client can tell which build it is
        # talking to. Without it the image reports the framework default 'dev'
        # and stale-build detection never fires.
        DOCLIFTS_BUILD_SHA: ${DOCLIFTS_BUILD_SHA:-unknown}
    # Parameterised so the step-4 abort path can name a previous image
    # concretely instead of describing it in prose. Roll back with:
    #   DOCLIFTS_WEB_IMAGE=doclifts-web:pre-0.2.0 scripts/compose-prod.sh up -d --wait web
    # Default is unchanged, so every existing invocation behaves identically.
    image: ${DOCLIFTS_WEB_IMAGE:-doclifts-web:vps}
    container_name: doclifts-web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      DATABASE_URL: postgresql://doclifts:${POSTGRES_PASSWORD:?set in the production env file; use scripts/compose-prod.sh}@db:5432/doclifts
      # adapter-node's CSRF check and Better Auth's cookie baseURL. With auth
      # live this MUST be the origin the browser actually uses, or the session
      # cookie is not Secure and sign-in does not persist. T6 sets it to the
      # Tailscale Serve HTTPS name; it is required, not defaulted, so a
      # half-configured release fails at boot rather than serving http cookies.
      ORIGIN: ${PUBLIC_ORIGIN:?set PUBLIC_ORIGIN in the production env file; use scripts/compose-prod.sh}
      # PUBLIC_ORIGIN must ALSO be passed under its own name, not just folded
      # into ORIGIN. `auth.ts` reads `env.PUBLIC_ORIGIN` to build Better Auth's
      # baseURL, and adapter-node populates $env/dynamic/private only from
      # variables present in the container's environment under their real
      # names. With ORIGIN alone, baseURL silently fell back to its
      # hardcoded `http://127.0.0.1:3000`, and Better Auth's `isAuthPath` then
      # compared every /api/auth request against that origin, matched nothing,
      # and let SvelteKit answer 404. A whole auth endpoint tree, invisible
      # because a fallback masked a missing variable.
      #
      # Set both to the same value, and never let them drift.
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?set PUBLIC_ORIGIN in the production env file; use scripts/compose-prod.sh}
      # Behind Tailscale Serve the socket sees plain HTTP and a Host of
      # localhost unless these say otherwise. Without them adapter-node builds
      # url.origin as http://localhost, every POST 403s on the CSRF check, and
      # the app redirects to a non-https URL. Naming the trusted headers lets it
      # reconstruct the real https://enochnvps... origin.
      #
      # Safe here specifically because the app binds to the tailnet IP, not
      # 0.0.0.0, so nothing off-tailnet can forge X-Forwarded-Host. Do not change
      # the ports publish to 0.0.0.0 without re-reading this.
      PROTOCOL_HEADER: x-forwarded-proto
      HOST_HEADER: x-forwarded-host
      # Better Auth signs session cookies with this. Without it auth.ts throws
      # at module load and the container never opens its listener — which is
      # the intended behaviour, but it means the secret MUST be passed into
      # the container explicitly. It lives in /srv/doclifts/.env and compose
      # does not read that file into the container by itself; an env_file:
      # would work but would also inject the other variables without
      # composition, so this stays an explicit, greppable line.
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set in the production env file; use scripts/compose-prod.sh}
      # Login throttle tuning. Compose enumerates the container environment
      # explicitly and does NOT read /srv/doclifts/.env into it, so a key added
      # there without a line here is silently absent from the container.
      #
      # Found by deploying: LOGIN_MAX_FAILURES=0 was written to the env file,
      # the deploy succeeded, every check passed, and `printenv` inside the
      # running container showed no LOGIN_* at all. The setting was not
      # weakened, it was absent — which means the default ceiling of 10 stayed
      # in force and the whole point of the change was not in effect.
      #
      # Every tunable needs a line here. The defaults are documented in
      # .env.example; uncomment to override.
      LOGIN_MAX_FAILURES: ${LOGIN_MAX_FAILURES:-10}
      LOGIN_FAILURE_WINDOW_SEC: ${LOGIN_FAILURE_WINDOW_SEC:-900}
      LOGIN_DELAY_AFTER_FAILURES: ${LOGIN_DELAY_AFTER_FAILURES:-5}
      LOGIN_DELAY_BASE_MS: ${LOGIN_DELAY_BASE_MS:-1000}
      LOGIN_DELAY_MAX_MS: ${LOGIN_DELAY_MAX_MS:-30000}
      SESSION_EXPIRES_DAYS: ${SESSION_EXPIRES_DAYS:-30}
      PASSWORD_MIN_LENGTH: ${PASSWORD_MIN_LENGTH:-12}
      # LLM adapter (0.3.1). All optional: the app boots and serves with none
      # set, and complete() throws LlmNotConfigured until OPENROUTER_API_KEY and
      # LLM_MODEL are present. They still need lines here, for the same reason
      # as LOGIN_*: a key in the env file without a line is absent from the
      # container. Empty means unset. Defaults match src/lib/server/llm/config.ts.
      LLM_PROVIDER: ${LLM_PROVIDER:-openrouter}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_VISION_MODEL: ${LLM_VISION_MODEL:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      LLM_TIMEOUT_MS: ${LLM_TIMEOUT_MS:-30000}
      LLM_MAX_CALLS_PER_USER_PER_HOUR: ${LLM_MAX_CALLS_PER_USER_PER_HOUR:-60}
      LLM_STORE_PROMPTS: ${LLM_STORE_PROMPTS:-0}
    # Publish on the VPS tailnet IP (not 127.0.0.1, not 0.0.0.0) so the app is
    # reachable from other tailnet devices (phone/laptop) but not the public
    # internet. DB stays off the host port.
    ports:
      - '100.118.77.26:3000:3000'
    # Health: an HTTP GET to / returns 200 once the app is serving.
    # Use 127.0.0.1 (not localhost): in Alpine, localhost may resolve to IPv6
    # ::1 first, and node listens on IPv4 0.0.0.0 — the IPv6 probe fails and
    # the container shows "unhealthy" even though the app is fine.
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3000/ >/dev/null 2>&1 || exit 1']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  doclifts_pgdata:
