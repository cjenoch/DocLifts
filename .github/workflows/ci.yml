name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: doclifts
          POSTGRES_PASSWORD: doclifts
          POSTGRES_DB: doclifts_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U doclifts"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          # No `cache:` — repo has no package-lock.json (pnpm is the local PM).
          # setup-node would fail trying to hash a non-existent lockfile.

      - name: Enable corepack pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.3.0 --activate

      - run: pnpm install --frozen-lockfile

      # Build DB URLs at runtime to keep the password out of YAML (CI tooling pipelines
      # sometimes redact the literal token form). drizzle.config.ts reads DATABASE_URL
      # (dotenv/config); test-db.ts reads TEST_DATABASE_URL. Same target DB in CI.
      - name: Export DB URLs
        run: |
          USER="doclifts"
          PW="$USER"
          HOST="localhost"
          PORT="5432"
          DB="doclifts_test"
          AT=$(printf '\x40')
          URL="postgresql://${USER}:${PW}${AT}${HOST}:${PORT}/${DB}"
          echo "DATABASE_URL=${URL}" >> "$GITHUB_ENV"
          echo "TEST_DATABASE_URL=${URL}" >> "$GITHUB_ENV"

      # Migrations: applied implicitly by the test setup. src/lib/server/test-db.ts
      # calls drizzle's programmatic migrate() at vitest startup, so the schema
      # exists before any test runs. No separate migrate step needed.

      # Blocking since 2026-09-29: the whole repo was formatted in one commit,
      # so any failure here is drift introduced by the change under test.
      - name: Lint
        run: pnpm run lint

      # svelte-kit sync + svelte-check.
      - run: pnpm run check

      # CI currently runs server project only (browser project has dedicated Browser CI workflow).
      - run: pnpm run test:unit --project server

      - run: pnpm run build

      # End-to-end pass against the built server: loads every page in a real
      # Chromium and fails on any Content-Security-Policy violation. The unit
      # suites cannot see the CSP header, which is how the 2026-09-28 CSP
      # change shipped with a visibly broken /reports page.
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: End-to-end (CSP + page render)
        run: pnpm run test:e2e

      # Signal only for now; can be promoted to blocking once baseline is clean.
      - name: Production dependency audit (signal)
        run: pnpm audit --prod || true
