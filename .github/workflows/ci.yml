name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Manual runs, e.g. to validate a workflow change on a branch before merging.
  workflow_dispatch:

# Jobs do not write to the repository or use secrets: a read-only token,
# stated here rather than left to the repository's default setting.
permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.scope.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - name: Classify the complete change
        id: scope
        run: node scripts/ci-scope.ts

  docs:
    needs: changes
    if: needs.changes.outputs.docs_only == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - name: Enable corepack pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.3.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  full-test:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The whole job runs inside the Playwright image so the browser suites
    # (vitest browser project + the e2e CSP pass) need no install step: the
    # image carries Chromium, the headless shell and every OS library. The
    # tag MUST match the `playwright` version in pnpm-lock.yaml — Playwright
    # looks for the browser revision its own version expects, and a mismatch
    # fails at launch. The "Verify browser" step below turns that into a
    # clear message. Bump both together.
    container:
      image: mcr.microsoft.com/playwright:v1.59.1-noble
    # Inside a container job the runner picks `sh` for `run` steps unless told
    # otherwise; dash's printf has no \x escapes and other bashisms break
    # silently. Pin bash so steps behave as they did on the bare runner.
    defaults:
      run:
        shell: bash
    env:
      # Baked into /_app/version.json. Set explicitly rather than left to the
      # git fallback in svelte.config.js.
      #
      # EARNED BY A RED BUILD: the non-vacuous version.json e2e passed locally
      # (a checkout has .git) and FAILED in CI, which reports the framework's
      # default 'dev'. A constant build id still serves, still looks healthy,
      # and silently disables stale-build detection.
      DOCLIFTS_BUILD_SHA: ${{ github.sha }}
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: doclifts
          POSTGRES_PASSWORD: doclifts
          POSTGRES_DB: doclifts_test
        options: >-
          --health-cmd "pg_isready -U doclifts -d doclifts_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          # No `cache:` — repo has no package-lock.json (pnpm is the local PM).
          # setup-node would fail trying to hash a non-existent lockfile.

      - name: Enable corepack pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.3.0 --activate

      - run: pnpm install --frozen-lockfile

      - name: Verify development runtime matches CI
        run: |
          test "$(node -p 'process.versions.node')" = "$(cat .node-version)"
          test "$(pnpm exec node -p 'process.versions.node')" = "$(cat .node-version)"

      - name: Verify browser matches Playwright version
        run: |
          node -e '
            const { chromium } = require("playwright");
            const fs = require("node:fs");
            const version = require("playwright/package.json").version;
            const p = chromium.executablePath();
            if (!fs.existsSync(p)) {
              console.error(`playwright ${version} expects ${p}, which the container image lacks.`);
              console.error("Bump the mcr.microsoft.com/playwright image tag in ci.yml to v" + version + ".");
              process.exit(1);
            }
            console.log(`playwright ${version} -> ${p}`);
          '

      # Build DB URLs at runtime so no literal `user:password@host` URL sits in
      # YAML (CI tooling pipelines sometimes redact that token form).
      # drizzle.config.ts reads DATABASE_URL (dotenv/config); test-db.ts reads
      # TEST_DATABASE_URL. Same target DB in CI. Inside a container job the
      # service is reached by its service name, not localhost.
      - name: Export DB URLs
        run: |
          USER="doclifts"
          PW="$USER"
          HOST="postgres"
          PORT="5432"
          DB="doclifts_test"
          URL="postgresql://${USER}:${PW}@${HOST}:${PORT}/${DB}"
          echo "DATABASE_URL=${URL}" >> "$GITHUB_ENV"
          echo "TEST_DATABASE_URL=${URL}" >> "$GITHUB_ENV"

      # Migrations: applied implicitly by the test setup. src/lib/server/test-db.ts
      # calls drizzle's programmatic migrate() at vitest startup, so the schema
      # exists before any test runs. No separate migrate step needed.

      # Blocking since 2026-09-29: the whole repo was formatted in one commit,
      # so any failure here is drift introduced by the change under test.
      - name: Lint
        run: pnpm run lint

      # svelte-kit sync + svelte-check.
      - run: pnpm run check

      # Snapshot-chain check. `drizzle-kit check` reads DATABASE_URL and
      # exits 0 WITHOUT saying anything when it is unset, so a local run can
      # look like a pass that never happened. CI has the Postgres service
      # URL exported above, which is what makes this a real gate.
      - name: Drizzle snapshot check
        run: pnpm exec drizzle-kit check

      - name: Server tests (Postgres integration)
        run: pnpm run test:unit --project server

      # Component tests in a real Chromium via vitest browser mode. Formerly a
      # separate Browser CI workflow, which GitHub auto-disabled for repo
      # inactivity on 2026-08-02 and which then silently never ran again.
      - name: Client tests (vitest browser mode)
        run: pnpm run test:unit --project client

      - run: pnpm run build

      # End-to-end pass against the built server: loads every page in a real
      # Chromium and fails on any Content-Security-Policy violation. The unit
      # suites cannot see the CSP header, which is how the 2026-09-28 CSP
      # change shipped with a visibly broken /reports page.
      - name: End-to-end (CSP + page render)
        run: pnpm run test:e2e

      # REPORT ONLY, never fails the job (owner decision, 2026-10-02): every
      # finding goes to the job summary, then one line saying whether a gate at
      # high would fail and which packages would trigger it. The same report
      # runs weekly in dependency-audit.yml.
      - name: Production dependency audit (report only)
        continue-on-error: true
        run: |
          pnpm audit --prod --json > audit.json || true
          node scripts/audit-summary.mjs audit.json >> "$GITHUB_STEP_SUMMARY"
          tail -n 1 "$GITHUB_STEP_SUMMARY"

  # The production image, built the way the VPS builds it (node:24.21.0-alpine).
  # Added in 0.4.0 for sharp, a native dependency: the test job above runs on
  # glibc, so it cannot show that the alpine runtime stage gets sharp's musl
  # binary. The Dockerfile's runtime stage loads sharp at build time, so a
  # missing binary fails this step rather than the first upload in production.
  docker:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: Build the runtime image
        run: >-
          docker build --target runtime
          --build-arg DOCLIFTS_BUILD_SHA=${{ github.sha }}
          -t doclifts-web:ci .

      - name: Verify production runtime matches development
        run: test "$(docker run --rm doclifts-web:ci node -p 'process.versions.node')" = "$(cat .node-version)"

      - name: sharp processes an image inside the runtime image
        run: >-
          docker run --rm -w /app doclifts-web:ci node -e
          "require('sharp')({create:{width:8,height:6,channels:3,background:'#123'}}).jpeg().toBuffer().then(b=>console.log('sharp ok',b.length))"

  # Preserve one stable check name; a failed/skipped dependency cannot silently pass.
  test:
    needs: [changes, docs, full-test, docker]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SCOPE_RESULT: ${{ needs.changes.result }}
      DOCS_ONLY: ${{ needs.changes.outputs.docs_only }}
      DOCS_RESULT: ${{ needs.docs.result }}
      FULL_RESULT: ${{ needs.full-test.result }}
      DOCKER_RESULT: ${{ needs.docker.result }}
    steps:
      - name: Require the selected gate to pass
        shell: bash
        run: |
          set -eu
          test "$SCOPE_RESULT" = success
          if [ "$DOCS_ONLY" = true ]; then
            test "$DOCS_RESULT" = success
            test "$FULL_RESULT" = skipped
            test "$DOCKER_RESULT" = skipped
          else
            test "$DOCS_ONLY" = false
            test "$FULL_RESULT" = success
            test "$DOCKER_RESULT" = success
          fi
