# Isolated, temporary demo. Never reads your .env or mounts a production volume.
name: doclifts-demo
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: local-demo-only
      POSTGRES_DB: doclifts_demo
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U demo -d doclifts_demo]
      interval: 3s
      timeout: 3s
      retries: 30
  init:
    build:
      context: .
      target: builder
    environment:
      DATABASE_URL: postgresql://demo:local-demo-only@db:5432/doclifts_demo
      DOCLIFTS_DEMO: '1'
    command: [sh, -c, 'pnpm db:migrate && pnpm exec tsx src/lib/server/db/seed.ts']
    depends_on:
      db:
        condition: service_healthy
  web:
    build:
      context: .
      target: runtime
    environment:
      DATABASE_URL: postgresql://demo:local-demo-only@db:5432/doclifts_demo
      DOCLIFTS_DEMO: '1'
      ORIGIN: http://localhost:4179
      HOST: 0.0.0.0
      PORT: '3000'
    ports:
      - '127.0.0.1:4179:3000'
    depends_on:
      init:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD-SHELL, 'wget -qO- http://127.0.0.1:3000/ >/dev/null || exit 1']
      interval: 5s
      timeout: 3s
      retries: 20
